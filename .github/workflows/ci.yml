name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build, detekt & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, detekt and unit tests
        run: ./gradlew assembleDebug detekt testDebugUnitTest --console=plain
